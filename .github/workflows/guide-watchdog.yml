name: Guide freshness watchdog

# Runs on GitHub's servers, independent of the home server. If any guide stops
# being refreshed, this run fails and GitHub e-mails the repository owner.
on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours
  workflow_dispatch: {}        # "Run workflow" button for a manual check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check every guide still has enough upcoming listings
        run: python3 .github/scripts/check_guides.py
