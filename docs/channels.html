<style>
  :root {
    --bg-deep: #060918; --bg-mid: #0d1225; --bg-card: #111827;
    --accent: #00BFFF; --green: #2ECC71; --purple: #7c3aed;
    --text: #e2e8f0; --muted: #8899aa; --border: rgba(0,191,255,0.15);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-deep); color: var(--text); font-family: 'DM Sans', sans-serif; }
  nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        padding: 16px 16px; padding: 16px clamp(16px, 4vw, 48px); background: rgba(6,9,24,0.85); border-bottom: 1px solid var(--border);
        position: sticky; top: 0; backdrop-filter: blur(8px); z-index: 2; }
  .nav-logo { font-family: 'Orbitron', monospace; font-weight: 900; color: var(--text); text-decoration: none; font-size: 1.2rem; }
  .nav-logo span { color: var(--accent); }
  nav a.back { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  nav a.back:hover { color: var(--accent); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; padding: 32px clamp(16px, 4vw, 32px) 64px; }
  h1 { font-family: 'Orbitron', monospace; font-size: 1.4rem; font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 8px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .search { width: 100%; padding: 14px 16px; font: inherit; font-size: 1.05rem; color: var(--text);
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; outline: none; }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,191,255,0.15); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .chip { font: inherit; font-size: 0.9rem; color: var(--text); background: rgba(0,191,255,0.05);
          border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: rgba(0,191,255,0.2); border-color: var(--accent); color: #fff; }
  .chip small { color: var(--muted); margin-left: 4px; }
  .status { color: var(--muted); font-size: 0.9rem; margin: 8px 0 12px; }
  ul.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  ul.list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
               padding: 10px 14px; background: var(--bg-card); border-top: 1px solid rgba(255,255,255,0.04); }
  ul.list li:first-child { border-top: 0; }
  ul.list li:nth-child(even) { background: #0f1522; }
  .name { font-weight: 500; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 0.78rem; padding: 2px 8px; border-radius: 6px; background: rgba(46,204,113,0.1);
         color: var(--green); border: 1px solid rgba(46,204,113,0.25); white-space: nowrap; }
  .more { text-align: center; margin-top: 16px; }
  .more button { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--border);
                 border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  .empty { padding: 24px; text-align: center; color: var(--muted); background: var(--bg-card); }
  .lang { font: inherit; font-size: 0.8rem; color: var(--accent); background: transparent; border: 1px solid var(--border);
          border-radius: 6px; padding: 3px 8px; cursor: pointer; margin-left: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px; }
  footer a { color: var(--accent); }
</style>

let guide = -1, shown = PAGE;
const q = document.getElementById('q'), list = document.getElementById('list'),
      status = document.getElementById('status'), more = document.getElementById('more'),
      chips = document.getElementById('chips');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const rows = DATA.rows.map(r => ({ name: r[0], key: norm(r[0]), g: r[1] }));

function chip(label, idx, count) {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button';
  b.setAttribute('aria-pressed', idx === guide ? 'true' : 'false');
  b.textContent = label;
  const sm = document.createElement('small'); sm.textContent = count.toLocaleString(); b.appendChild(sm);
  b.onclick = () => { guide = idx; shown = PAGE; drawChips(); render(); };
  return b;
}
function drawChips() {
  chips.replaceChildren(chip(tr('all'), -1, rows.length),
    ...DATA.guides.map((g, i) => chip(gname(g), i, DATA.counts[i])));
}
function render() {
  const words = norm(q.value).split(/\s+/).filter(Boolean);
  const hits = rows.filter(r => (guide < 0 || r.g.includes(guide)) && words.every(w => r.key.includes(w)));
  list.replaceChildren();
  if (!hits.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = tr('none'); list.appendChild(li);
  }
  for (const r of hits.slice(0, shown)) {
    const li = document.createElement('li');
    const n = document.createElement('span'); n.className = 'name'; n.textContent = r.name;
    const t = document.createElement('span'); t.className = 'tags';
    for (const gi of r.g) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = gname(DATA.guides[gi]); t.appendChild(s); }
    li.append(n, t); list.appendChild(li);
  }
  status.textContent = hits.length.toLocaleString() + ' ' + (hits.length === 1 ? tr('ch1') : tr('chN')) +
    (hits.length > shown ? ' — ' + tr('first', { n: shown.toLocaleString() }) : '');
  more.hidden = hits.length <= shown;
}
q.addEventListener('input', () => { shown = PAGE; render(); });
more.onclick = () => { shown += PAGE; render(); };
drawChips(); render();
</script>
<script src="nav.js" data-base=""></script>
<script src="app.js" data-base=""></script>
</body>
