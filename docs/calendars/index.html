          border: 1px solid rgba(255,255,255,0.04); border-radius: 10px; margin-bottom: 8px; }
  .team img, .team .ph { width: 36px; height: 36px; object-fit: contain; flex: none; }
  .team .ph { border-radius: 8px; background: rgba(0,191,255,0.08); }
  .team .nm { flex: 1; min-width: 160px; font-weight: 500; }
  .team .nm small { display: block; color: var(--muted); font-weight: 400; font-size: 0.78rem; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btns a, .btns button { font: inherit; font-size: 0.82rem; text-decoration: none; color: var(--text); background: transparent;
