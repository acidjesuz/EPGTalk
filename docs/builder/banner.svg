<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a12"/>
      <stop offset="0.6" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#0b2a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
